        // ============================================================
        // REFERENCIAS DOM
        // ============================================================
        const tableBody       = catalog.querySelector('#tableBody');
        const resultCountEl   = catalog.querySelector('#resultCount');
        const platformChecks  = catalog.querySelectorAll('#platformChecks input[type="checkbox"]');
        const searchInput     = catalog.querySelector('#searchInput');
        const genreFilter     = catalog.querySelector('#genreFilter');
        const yearFilter      = catalog.querySelector('#yearFilter');
        const scoreFilter     = catalog.querySelector('#scoreFilter');
        const resetBtn        = catalog.querySelector('#resetBtn');
        const paginationEl    = catalog.querySelector('#pagination');

        // ============================================================
        // ESTADO DE PAGINACIÓN
        // ============================================================
        let currentPage = 1;
        const PAGE_SIZE = 100;

        // ============================================================
        // FUNCIONES
        // ============================================================

        /** Rellena el desplegable de años con los años disponibles. */
        function populateYearFilter() {
            const years = [...new Set(games.map(g => g.year))].sort((a, b) => b - a);
            let html = '<option value="all">Todos</option>';
            years.forEach(y => {
                html += `<option value="${y}">${y}</option>`;
            });
            yearFilter.innerHTML = html;
        }

        /** Devuelve el array de plataformas seleccionadas. */
        function getSelectedPlatforms() {
            return Array.from(platformChecks)
                .filter(cb => cb.checked)
                .map(cb => cb.value);
        }

        /** Devuelve la clase CSS del badge según la plataforma. */
        function platformBadgeClass(platform) {
            switch (platform) {
                case 'PC':          return 'badge-pc';
                case 'Nintendo':    return 'badge-nintendo';
                case 'Xbox':        return 'badge-xbox';
                case 'PlayStation': return 'badge-playstation';
                default:            return '';
            }
        }

        /** Clase para el color de la calificación. */
        function scoreClass(score) {
            if (score === null) return 'unrated';
            if (score >= 95) return 'high';
            if (score >= 90) return 'mid';
            return '';
        }

        /** Obtiene el listado filtrado (sin paginar). */
        function getFilteredGames() {
            const selectedPlatforms = getSelectedPlatforms();
            const searchTerm = searchInput.value.trim().toLowerCase();
            const genre = genreFilter.value;
            const year = yearFilter.value;
            const scoreRange = scoreFilter.value;

            return games.filter(g => {
                // Plataforma
                if (selectedPlatforms.length > 0 && !selectedPlatforms.includes(g.platform)) {
                    return false;
                }
                // Búsqueda por nombre
                if (searchTerm && !g.name.toLowerCase().includes(searchTerm)) {
                    return false;
                }
                // Género
                if (genre !== 'all' && g.genre !== genre) {
                    return false;
                }
                // Año
                if (year !== 'all' && g.year !== parseInt(year, 10)) {
                    return false;
                }
                // Calificación
                if (scoreRange === 'unrated') {
                    if (g.score !== null) return false;
                } else if (scoreRange !== 'all') {
                    if (g.score === null) return false;
                    const [min, max] = scoreRange.split('-').map(Number);
                    if (g.score < min || g.score > max) {
                        return false;
                    }
                }
                return true;
            });
        }

        /** Renderiza la tabla y la paginación. */
        function renderTable() {
            const filtered = getFilteredGames();

            // Ordenar por calificación descendente y luego por año descendente
            filtered.sort((a, b) => {
                if (a.score === null && b.score !== null) return 1;
                if (b.score === null && a.score !== null) return -1;
                if (a.score !== null && b.score !== null && b.score !== a.score) {
                    return b.score - a.score;
                }
                return b.year - a.year;
            });

            const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));

            // Ajustar página actual si es necesario
            if (currentPage > totalPages) {
                currentPage = totalPages;
            }

            // Calcular rango de la página
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = Math.min(start + PAGE_SIZE, filtered.length);
            const pageGames = filtered.slice(start, end);

            // Construir filas
            if (filtered.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="6" class="empty-message">No se encontraron videojuegos con esos filtros.</td></tr>`;
                resultCountEl.innerHTML = 'Mostrando <strong>0</strong> resultados';
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';
            pageGames.forEach((game, index) => {
                const rank = start + index + 1;
                html += `
                    <tr>
                        <td class="rank">${rank}</td>
                        <td class="game-name">${game.name}</td>
                        <td><span class="badge ${platformBadgeClass(game.platform)}">${game.platform}</span></td>
                        <td class="year">${game.year}</td>
                        <td class="genre">${game.genre}</td>
                        <td class="score ${scoreClass(game.score)}">${game.score === null ? 'N/D' : game.score}</td>
                    </tr>
                `;
            });

            tableBody.innerHTML = html;
            resultCountEl.innerHTML = `Mostrando <strong>${pageGames.length}</strong> de <strong>${filtered.length}</strong> videojuego${filtered.length !== 1 ? 's' : ''} (Total: ${games.length})`;

            // Renderizar paginación
            renderPagination(totalPages);
        }

        /** Renderiza los controles de paginación. */
        function renderPagination(totalPages) {
            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';

            // Botón anterior
            html += `<button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">« Anterior</button>`;

            // Calcular rango de páginas visibles (máximo 5)
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage + 1 < maxVisible) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            // Primera página y elipsis
            if (startPage > 1) {
                html += `<button data-page="1">1</button>`;
                if (startPage > 2) {
                    html += `<span class="page-info">…</span>`;
                }
            }

            // Páginas visibles
            for (let i = startPage; i <= endPage; i++) {
                html += `<button class="${i === currentPage ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            // Última página y elipsis
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    html += `<span class="page-info">…</span>`;
                }
                html += `<button data-page="${totalPages}">${totalPages}</button>`;
            }

            // Botón siguiente
            html += `<button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">Siguiente »</button>`;

            paginationEl.innerHTML = html;
        }

        /** Cambia a una página específica. */
        function goToPage(page) {
            currentPage = page;
            renderTable();
            // Desplazar al inicio de la tabla
            catalog.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        /** Restablece todos los filtros a sus valores por defecto. */
        function resetFilters() {
            platformChecks.forEach(cb => cb.checked = true);
            searchInput.value = '';
            genreFilter.value = 'all';
            yearFilter.value = 'all';
            scoreFilter.value = 'all';
            currentPage = 1;
            renderTable();
        }

        // ============================================================
        // INICIALIZACIÓN Y EVENTOS
        // ============================================================
        populateYearFilter();

        platformChecks.forEach(cb => cb.addEventListener('change', () => { currentPage = 1; renderTable(); }));
        searchInput.addEventListener('input', () => { currentPage = 1; renderTable(); });
        genreFilter.addEventListener('change', () => { currentPage = 1; renderTable(); });
        yearFilter.addEventListener('change', () => { currentPage = 1; renderTable(); });
        scoreFilter.addEventListener('change', () => { currentPage = 1; renderTable(); });
        resetBtn.addEventListener('click', resetFilters);

        paginationEl.addEventListener('click', (event) => {
            const button = event.target instanceof Element ? event.target.closest('button[data-page]') : null;
            if (!button || button.disabled) return;
            goToPage(Number(button.dataset.page));
        });

        // Render inicial
        renderTable();
    
})();
</script>
